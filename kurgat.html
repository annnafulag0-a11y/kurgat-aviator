<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KURGAT - UI Simulation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: white; display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 400px; background-color: #1a1d21; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; padding: 15px; background-color: #0f1114; font-size: 14px; }
        .balance { color: #4ade80; font-weight: bold; }

        .game-area {
            height: 300px;
            background: radial-gradient(circle, #2a2e33 0%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .multiplier-display {
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            z-index: 10;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: transform 0.1s;
        }

        .status-text {
            font-size: 14px;
            color: #a0a0a0;
            margin-top: 10px;
            z-index: 10;
        }

        .plane {
            position: absolute;
            font-size: 40px;
            bottom: 20px;
            left: 20px;
            transition: all 0.5s linear;
            opacity: 0;
        }

        .controls {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #1a1d21;
        }

        .bet-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .bet-btn:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
        }
        
        .cashout-btn {
            background-color: #f59e0b;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>KURGAT</div>
        <div class="balance">1,000.00 KES</div>
    </div>

    <div class="game-area">
        <div class="plane" id="plane">✈️</div>
        <div class="multiplier-display" id="multiplier">1.00x</div>
        <div class="status-text" id="status">Waiting for next round...</div>
    </div>

    <div class="controls">
        <button class="bet-btn" id="actionBtn" onclick="handleAction()">Bet</button>
    </div>
</div>

<script>
    // --- DISCLAIMER: This is purely a visual simulation for educational purposes. ---
    // --- It does not reflect real gambling mechanics or provably fair algorithms. ---

    let currentMultiplier = 1.00;
    let gameInterval;
    let isPlaying = false;
    let hasBet = false;
    let planeElement = document.getElementById('plane');
    let multiplierDisplay = document.getElementById('multiplier');
    let statusText = document.getElementById('status');
    let actionBtn = document.getElementById('actionBtn');

    // Function to generate a random crash point for the simulation
    function getRandomCrashPoint() {
        // A simplified, unrealistic curve to make the game look interesting
        let rand = Math.random();
        if (rand < 0.4) return 1 + (Math.random() * 1.5); // Crashes early (1.0x - 2.5x)
        if (rand < 0.8) return 2 + (Math.random() * 5);   // Crashes mid (2.0x - 7.0x)
        return 7 + (Math.random() * 20);                  // Crashes high (7.0x+)
    }

    function startRound() {
        isPlaying = true;
        hasBet = false;
        currentMultiplier = 1.00;
        let crashPoint = getRandomCrashPoint();
        
        multiplierDisplay.style.color = '#fff';
        multiplierDisplay.innerText = '1.00x';
        statusText.innerText = 'Round in progress...';
        actionBtn.innerText = 'Cash Out (1.00x)';
        actionBtn.className = 'bet-btn cashout-btn';
        
        // Reset plane position
        planeElement.style.opacity = '1';
        planeElement.style.bottom = '20px';
        planeElement.style.left = '20px';
        planeElement.style.transform = 'rotate(0deg)';

        gameInterval = setInterval(() => {
            // Increment multiplier (simulating game logic)
            currentMultiplier += 0.05 + (currentMultiplier * 0.01); 
            
            multiplierDisplay.innerText = currentMultiplier.toFixed(2) + 'x';

            // Animate plane flying up and right
            let bottom = parseFloat(planeElement.style.bottom) + 2;
            let left = parseFloat(planeElement.style.left) + 1.5;
            planeElement.style.bottom = bottom + 'px';
            planeElement.style.left = left + 'px';
            planeElement.style.transform = `rotate(${left / 2}deg)`;

            // Check if the round should crash
            if (currentMultiplier >= crashPoint) {
                endRound(false); // Crashed
            }
        }, 100); // Updates every 100ms
    }

    function endRound(wasCashedOut) {
        clearInterval(gameInterval);
        isPlaying = false;
        
        if (wasCashedOut) {
            statusText.innerText = `You won! Cashed out at ${currentMultiplier.toFixed(2)}x`;
            multiplierDisplay.style.color = '#4ade80'; // Green for win
        } else {
            statusText.innerText = `Crashed at ${currentMultiplier.toFixed(2)}x!`;
            multiplierDisplay.style.color = '#e02434'; // Red for crash
            multiplierDisplay.innerText = `${currentMultiplier.toFixed(2)}x`;
        }

        // Reset plane
        planeElement.style.opacity = '0';
        
        // Reset button for next round
        actionBtn.innerText = 'Bet';
        actionBtn.className = 'bet-btn';
        actionBtn.disabled = false;

        // Automatically start a new round after a short delay
        setTimeout(() => {
            if (!isPlaying) {
                 statusText.innerText = 'Waiting for next round...';
                 multiplierDisplay.style.color = '#fff';
                 multiplierDisplay.innerText = '1.00x';
                 // In a real game, a countdown would happen here
                 setTimeout(startRound, 2000); 
            }
        }, 3000);
    }

    function handleAction() {
        if (!isPlaying) {
            // If game isn't playing, bet starts the round (simulation)
            startRound();
            hasBet = true;
            actionBtn.innerText = 'Cash Out (1.00x)';
            actionBtn.className = 'bet-btn cashout-btn';
        } else if (isPlaying && hasBet) {
            // If currently playing and has a bet, cash out
            hasBet = false;
            endRound(true);
        }
    }

    // Start the very first round after a brief load
    setTimeout(startRound, 1000);

</script>
</body>
</html>
